<!DOCTYPE html>
<html>
<head>
    <title>図書館管理システム</title>
    
    <style>
        li {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <h1>図書館管理システム</h1>
        <!-- ここにメッセージを表示する -->




        <h2>書籍登録</h2>
        
        <form action="{{ url_for('add_book') }}" method="POST">
            <label>書籍名：</label>
            <input type="text" name="title">
            <label>書籍ID：</label>
            <input type="text" name="book_id">
            <button type="submit">登録</button>
        </form>

        <h2>書籍一覧</h2>
        <ul>
            {% for book in books %}
                <li>
                    {{ book.book_id }}
                    {{ book.title }}
                    {% if book.is_borrowed %}
                        貸出中
                    {% else %}
                        貸出可能
                    {% endif %}
                </li>
            {% endfor %}
            
            <!-- ここに貸出・返却ボタンを追加する -->
             {% if book.is_borrowed %}
            <form action="{{ url_for('return_book', book_id=book.book_id) }}" method="POST">
                <button type="submit">返却</button>
            </form>

            {% else %}
            <form action="{{ url_for('borrow_book', book_id=book.book_id) }}" method="POST">
                <button type="submit">貸出</button>
            </form>
            {% endif %}

        </ul>



</body>





</html>
